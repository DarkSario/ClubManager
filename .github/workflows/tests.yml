name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (pylint)
        run: pylint --rcfile=.pylintrc club_manager/config.py club_manager/core/logger.py club_manager/core/migrations.py club_manager/core/database.py club_manager/core/smtp_util.py club_manager/core/members.py club_manager/core/export.py
      - name: Lint (flake8)
        run: flake8 club_manager/config.py club_manager/core/logger.py club_manager/core/migrations.py club_manager/core/database.py club_manager/core/smtp_util.py club_manager/core/members.py club_manager/core/export.py tests
      - name: Format check (black)
        run: black --check club_manager/config.py club_manager/core/logger.py club_manager/core/migrations.py club_manager/core/database.py club_manager/core/smtp_util.py club_manager/core/members.py club_manager/core/export.py tests
      - name: Type check (mypy)
        run: mypy
      - name: Tests
        run: pytest --cov-report=xml --cov-fail-under=70
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
