name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run : exécute tests et build sans créer de release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest --cov-fail-under=70
      - name: Build source archive
        shell: bash
        run: git archive --format=zip --prefix=ClubManager/ -o "ClubManager-${GITHUB_REF_NAME//\//-}.zip" HEAD
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: source-archive
          path: ClubManager-*.zip

  publish:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: source-archive
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ClubManager-*.zip
          generate_release_notes: true
