name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest --cov-fail-under=50
      - name: Build source archive
        run: git archive --format=zip --prefix=ClubManager/ -o ClubManager-${{ github.ref_name }}.zip HEAD
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ClubManager-${{ github.ref_name }}.zip
          generate_release_notes: true
